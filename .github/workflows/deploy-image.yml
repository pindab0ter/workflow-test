name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - staging

jobs:
  build-frontend:
    uses: ./.github/workflows/build-frontend.yml
    with:
      origin_name: deploy-image

  build-before-deploy:
    needs: [build-frontend]
    uses: ./.github/workflows/build-image.yml
    with:
      assets_artifact_name: ${{ needs.build-frontend.outputs.assets_artifact_name }}

  test-before-deploy:
    needs: [build-frontend]
    uses: run-tests.yml
    with:
      assets_artifact_name: ${{ needs.build-frontend.outputs.assets_artifact_name }}

  deploy-image:
    runs-on: ubuntu-latest
    needs: [build-before-deploy, test-before-deploy]
    steps:
      - name: Deploy
        run: |
          # Deployment steps here
          echo "Deploying the application..."
